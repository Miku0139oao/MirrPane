name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.3.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: '0'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          RAW_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $raw = $env:RAW_RELEASE_VERSION
          $clean = $raw.Trim().TrimStart('v', 'V')
          if ($clean -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'invalid release version' }
          "version=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Cache FFmpeg win64 runtime
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-runtime-win64-abi63-${{ hashFiles('scripts/fetch-ffmpeg.ps1', 'backend/internal/ffmpeg/runtime.go') }}

      - name: Detect or download verified FFmpeg runtime
        shell: pwsh
        run: .\scripts\fetch-ffmpeg.ps1

      - name: Run tests and analyze
        shell: pwsh
        run: |
          Push-Location backend
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./internal/decode ./internal/fairplay ./internal/ffmpeg ./cmd/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          Push-Location frontend
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build and package release
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          .\package.ps1 -Version $ver
          $zipName = "MirrPane-$ver-win64.zip"
          $zipPath = Join-Path "dist" $zipName
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content -Path "$zipPath.sha256" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 鏡屏 MirrPane v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/MirrPane-${{ steps.ver.outputs.version }}-win64.zip
            dist/MirrPane-${{ steps.ver.outputs.version }}-win64.zip.sha256
