name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Configure 64-bit MinGW GCC for cgo
        shell: pwsh
        run: |
          $candidates = @(
            'C:\msys64\mingw64\bin',
            'C:\mingw64\bin',
            'C:\ProgramData\mingw64\mingw64\bin'
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
          if ($null -eq $found) {
            $cmd = Get-Command gcc.exe -ErrorAction SilentlyContinue
            if ($null -ne $cmd) { $found = Split-Path -Parent $cmd.Source }
          }
          if ($null -eq $found) { throw "64-bit MinGW gcc.exe not found on runner" }
          $found | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=$($found -replace '\\','/')/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $found 'gcc.exe') --version

      - name: Cache FFmpeg win64 dev package
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-win64-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg dev package
        shell: pwsh
        run: .\scripts\fetch-ffmpeg.ps1

      - name: Backend build & test
        shell: pwsh
        run: |
          cd backend
          $env:PATH = "$PWD\..\third_party\ffmpeg\bin;$env:PATH"
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v ./internal/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend pub get & analyze
        shell: pwsh
        run: |
          cd frontend
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable build
        shell: pwsh
        run: .\package.ps1 -Version "0.0.0-ci"

      - name: Upload CI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrPane-win64-ci
          path: dist/MirrPane-0.0.0-ci-win64.zip
          retention-days: 7
