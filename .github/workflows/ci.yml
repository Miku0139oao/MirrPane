name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  pure-go-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test portable protocol and crypto without FFmpeg or a C compiler
        working-directory: backend
        run: go test ./internal/fairplay ./internal/pairing ./internal/mirror ./internal/config ./internal/protocol ./internal/mdns ./internal/ffmpeg
      - name: Cross-compile the complete Windows backend with cgo disabled
        working-directory: backend
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Cache FFmpeg win64 runtime
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-runtime-win64-abi63-${{ hashFiles('scripts/fetch-ffmpeg.ps1', 'backend/internal/ffmpeg/runtime.go') }}

      - name: Detect or download verified FFmpeg runtime
        shell: pwsh
        run: .\scripts\fetch-ffmpeg.ps1 -Pinned

      - name: Backend build & test
        shell: pwsh
        run: |
          cd backend
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend pub get & analyze
        shell: pwsh
        run: |
          cd frontend
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable build
        shell: pwsh
        run: .\package.ps1 -Version "0.0.0-ci"

      - name: Upload CI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrPane-win64-ci
          path: dist/MirrPane-0.0.0-ci-win64.zip
          retention-days: 7
